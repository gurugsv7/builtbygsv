# BuiltbyGSV API: enquiries and first-party, cookieless analytics on Cloudflare's free tier.
name = "builtbygsv-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# Optional custom domain once builtbygsv.in DNS is on Cloudflare:
# routes = [{ pattern = "api.builtbygsv.in", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://www.builtbygsv.in,https://builtbygsv.in,http://localhost:3000,http://localhost:4173"

[[d1_databases]]
binding = "DB"
database_name = "builtbygsv"
# Replaced with the real id after `wrangler d1 create builtbygsv`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Secrets (set with `wrangler secret put NAME`, never committed):
#   IP_SALT            random string used to hash IPs for rate limiting
#   STATS_TOKEN        bearer token for GET /stats and GET /enquiries
#   TELEGRAM_BOT_TOKEN optional: alerts for new enquiries
#   TELEGRAM_CHAT_ID   optional: chat that receives the alerts
